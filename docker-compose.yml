version: "3.8"

services:
  vetra-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vetra-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - media_storage:/app/media
      - logs_storage:/app/logs
    networks:
      - vetra-net

  vetra-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vetra-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VETRA_API_URL=http://vetra-backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - vetra-backend
    networks:
      - vetra-net

volumes:
  media_storage:
    name: vetra_media_storage
  logs_storage:
    name: vetra_logs_storage

networks:
  vetra-net:
    name: vetra_network
    driver: bridge
